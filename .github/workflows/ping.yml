# Test minimal : un job qui ne fait qu'afficher une ligne.
# Il ne touche à rien. Son seul but est de distinguer deux causes possibles
# quand un workflow meurt en deux secondes sans logs :
#   - si CE job échoue aussi, aucun runner n'est alloué au compte, et le
#     problème n'a rien à voir avec le contenu des workflows ;
#   - s'il réussit, la panne est propre aux workflows de déploiement.
name: Ping

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "runner vivant — $(date -u)"
