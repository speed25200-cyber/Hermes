# One-off probe of OKX public "rubik" data endpoints (open interest, taker
# volume, long/short ratio): response shapes, pagination behaviour and how
# far back history goes. Runs on the Actions runner; no VPS or keys needed.

name: Probe OKX aux endpoints

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        shell: python {0}
        run: |
          import json, time, urllib.request

          BASE = "https://www.okx.com"

          def get(path, **params):
              qs = "&".join(f"{k}={v}" for k, v in params.items() if v is not None)
              url = f"{BASE}{path}?{qs}"
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          p = json.load(r)
                      if str(p.get("code")) != "0":
                          print(f"  API code={p.get('code')} msg={p.get('msg')}  [{url}]")
                          return None
                      return p["data"]
                  except Exception as e:
                      print(f"  attempt {attempt}: {e}")
                      time.sleep(2 ** attempt)
              return None

          def fmt_ts(ms):
              return time.strftime("%Y-%m-%d %H:%M", time.gmtime(int(ms) / 1000))

          def probe(title, path, ts_key=None, **params):
              print(f"\n=== {title} ===")
              print(f"    {path} {params}")
              data = get(path, **params)
              if not data:
                  print("  NO DATA")
                  return None
              first, last = data[0], data[-1]
              print(f"  rows={len(data)}")
              print(f"  first row: {json.dumps(first)[:300]}")
              print(f"  last  row: {json.dumps(last)[:300]}")
              def ts_of(row):
                  if isinstance(row, dict):
                      return int(row.get("ts") or row.get(ts_key or "ts"))
                  return int(row[0])
              print(f"  newest={fmt_ts(ts_of(first))}  oldest={fmt_ts(ts_of(last))}")
              return data, ts_of

          INST = "BTC-USDT-SWAP"

          # ---- open interest history (contract) --------------------------
          r = probe("OI history 1H", "/api/v5/rubik/stat/contracts/open-interest-history",
                    instId=INST, period="1H", limit=100)
          # paginate backwards to find history depth
          if r:
              data, ts_of = r
              oldest = ts_of(data[-1])
              for i in range(60):
                  time.sleep(0.35)
                  nxt = get("/api/v5/rubik/stat/contracts/open-interest-history",
                            instId=INST, period="1H", limit=100, end=oldest)
                  if not nxt:
                      print(f"  pagination stopped after {i} pages (end={fmt_ts(oldest)})")
                      break
                  o2 = ts_of(nxt[-1])
                  if o2 >= oldest:
                      print(f"  no progress at {fmt_ts(oldest)}; stopping")
                      break
                  oldest = o2
              print(f"  OI DEEPEST REACHED: {fmt_ts(oldest)}")

          # try 'after' as pagination param too
          probe("OI history 1H with after=", "/api/v5/rubik/stat/contracts/open-interest-history",
                instId=INST, period="1H", limit=100,
                after=int(time.time()*1000) - 5*86400_000)

          # ---- taker volume (contract) -----------------------------------
          r = probe("Taker volume 1H", "/api/v5/rubik/stat/taker-volume-contract",
                    instId=INST, period="1H", limit=100)
          if r:
              data, ts_of = r
              oldest = ts_of(data[-1])
              for i in range(60):
                  time.sleep(0.35)
                  nxt = get("/api/v5/rubik/stat/taker-volume-contract",
                            instId=INST, period="1H", limit=100, end=oldest)
                  if not nxt:
                      print(f"  pagination stopped after {i} pages (end={fmt_ts(oldest)})")
                      break
                  o2 = ts_of(nxt[-1])
                  if o2 >= oldest:
                      print(f"  no progress at {fmt_ts(oldest)}; stopping")
                      break
                  oldest = o2
              print(f"  TAKER DEEPEST REACHED: {fmt_ts(oldest)}")

          # ---- long/short account ratio (contract) -----------------------
          r = probe("Long/short ratio 1H",
                    "/api/v5/rubik/stat/contracts/long-short-account-ratio-contract",
                    instId=INST, period="1H", limit=100)
          if r:
              data, ts_of = r
              oldest = ts_of(data[-1])
              for i in range(60):
                  time.sleep(0.35)
                  nxt = get("/api/v5/rubik/stat/contracts/long-short-account-ratio-contract",
                            instId=INST, period="1H", limit=100, end=oldest)
                  if not nxt:
                      print(f"  pagination stopped after {i} pages (end={fmt_ts(oldest)})")
                      break
                  o2 = ts_of(nxt[-1])
                  if o2 >= oldest:
                      print(f"  no progress at {fmt_ts(oldest)}; stopping")
                      break
                  oldest = o2
              print(f"  LSR DEEPEST REACHED: {fmt_ts(oldest)}")

          # ---- top-trader variants & elite ratios ------------------------
          probe("Top-trader L/S (position)",
                "/api/v5/rubik/stat/contracts/long-short-position-ratio-contract-top-trader",
                instId=INST, period="1H", limit=30)
          probe("Top-trader L/S (account)",
                "/api/v5/rubik/stat/contracts/long-short-account-ratio-contract-top-trader",
                instId=INST, period="1H", limit=30)

          # ---- smaller alt to check per-inst coverage --------------------
          probe("OI history alt (NEAR)", "/api/v5/rubik/stat/contracts/open-interest-history",
                instId="NEAR-USDT-SWAP", period="1H", limit=10)
          probe("Taker alt (NEAR)", "/api/v5/rubik/stat/taker-volume-contract",
                instId="NEAR-USDT-SWAP", period="1H", limit=10)
          probe("LSR alt (NEAR)",
                "/api/v5/rubik/stat/contracts/long-short-account-ratio-contract",
                instId="NEAR-USDT-SWAP", period="1H", limit=10)

          print("\nprobe complete")
