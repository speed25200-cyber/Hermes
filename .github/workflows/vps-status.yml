# Letat dHermes sur le VPS. A declencher a la main quand on veut.
#
# Le rapport lui-meme est dans deploy/etat.sh, pousse par lentree
# standard. Il etait auparavant ecrit A LINTERIEUR de la commande ssh,
# elle-meme entouree dapostrophes : une seule apostrophe de plus
# nimporte ou dedans cassait tout le releve, et il fallait les compter
# a chaque modification. Le script est maintenant un fichier ordinaire,
# lisible et verifiable par bash -n.

name: VPS status

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false
      lien:
        description: "UUID SwissTransfer a rapatrier sur le VPS (vide = rapport de statut)"
        required: false
        default: ""

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass

      - name: Resolve SSH access
        env:
          PW_INPUT: ${{ inputs.root_password }}
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          PW="${PW_INPUT:-$PW_SECRET}"
          [ -z "$PW" ] && { echo "::error::no credentials"; exit 1; }
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"; echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then CUR="$PW"; elif try "$ALT"; then CUR="$ALT"; else
            echo "::error::cannot authenticate"; exit 1; fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Rapatrier une archive sur le VPS
        if: ${{ inputs.lien }}
        env:
          LIEN: ${{ inputs.lien }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            bash -s -- "$LIEN" < deploy/rapatrier_archive.sh

      - name: Status report
        if: ${{ !inputs.lien }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            bash -s < deploy/etat.sh
