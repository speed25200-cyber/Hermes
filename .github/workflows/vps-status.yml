# Letat dHermes sur le VPS. A declencher a la main quand on veut.
#
# Le rapport lui-meme est dans deploy/etat.sh, pousse par lentree
# standard. Il etait auparavant ecrit A LINTERIEUR de la commande ssh,
# elle-meme entouree dapostrophes : une seule apostrophe de plus
# nimporte ou dedans cassait tout le releve, et il fallait les compter
# a chaque modification. Le script est maintenant un fichier ordinaire,
# lisible et verifiable par bash -n.

name: VPS status

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false
      lien:
        description: "UUID SwissTransfer a rapatrier sur le VPS (vide = rapport de statut)"
        required: false
        default: ""
      poser_cles:
        description: "Poser les cles OKX sur le serveur depuis les secrets du depot (mettre oui)"
        required: false
        default: ""

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass

      - name: Resolve SSH access
        env:
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Les entrees de workflow_dispatch se lisent dans le FICHIER
          # DEVENEMENT du runner, jamais dans env: ni par une expression
          # GitHub interpolee dans le script. Le runner imprime le bloc env: et le texte du script
          # AVANT la premiere commande — donc avant tout masque. Cest
          # ainsi que le mot de passe root a fini en clair dans lentete
          # de chaque run depuis la creation de ce workflow (verifie le
          # 5 septembre 2026, ligne « PW_INPUT: ... »). Un secret de
          # depot est masque doffice ; une entree ne lest jamais.
          PW_INPUT=$(jq -r '.inputs.root_password // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$PW_INPUT" ]; then echo "::add-mask::$PW_INPUT"; fi
          PW="${PW_INPUT:-$PW_SECRET}"
          [ -z "$PW" ] && { echo "::error::no credentials"; exit 1; }
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"; echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then CUR="$PW"; elif try "$ALT"; then CUR="$ALT"; else
            echo "::error::cannot authenticate"; exit 1; fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Rapatrier une archive sur le VPS
        if: ${{ inputs.lien }}
        env:
          LIEN: ${{ inputs.lien }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            bash -s -- "$LIEN" < deploy/rapatrier_archive.sh

      # Les cles ne transitent NI par le depot, NI par une conversation,
      # NI par un argument de commande. Elles vivent dans les secrets
      # chiffres du depot, GitHub les masque dans tous les journaux, et
      # elles voyagent jusquau serveur par lentree standard — un
      # argument serait visible dans la liste des processus de la
      # machine le temps que la commande vive.
      #
      # Le script les TESTE aupres dOKX avant de les ecrire : une cle
      # posee sans etre verifiee est une cle dont on decouvre trois
      # jours plus tard quelle portait la mauvaise restriction dIP.
      - name: Poser les cles OKX
        if: ${{ inputs.poser_cles }}
        env:
          K: ${{ secrets.OKX_API_KEY }}
          S: ${{ secrets.OKX_API_SECRET }}
          P: ${{ secrets.OKX_API_PASSPHRASE }}
          SIM: ${{ secrets.OKX_SIMULATED }}
          # Un secret unique portant les trois valeurs separees par « : ».
          # Sur telephone, modifier un secret coute un formulaire, en
          # creer trois en coute trois : accepter les deux formes est une
          # commodite qui ne coute rien.
          UN: ${{ secrets.OKTOKEN }}
          # Noms voisins, sondes UNIQUEMENT pour dire sous lequel les
          # secrets ont ete enregistres. « vide » ne dit pas ou chercher ;
          # « vous les avez appeles OKX_KEY » le dit.
          V1: ${{ secrets.OKX_KEY }}
          V2: ${{ secrets.OKX_ACCESS_KEY }}
          V3: ${{ secrets.OK_ACCESS_KEY }}
          V4: ${{ secrets.API_KEY }}
          V5: ${{ secrets.OKX_SECRET }}
          V6: ${{ secrets.OKX_PASSPHRASE }}
          V7: ${{ secrets.OKX_API_PASS }}
        run: |
          set -eu
          # Diagnostic AVANT toute connexion : on ne derange pas le
          # serveur pour rien, et surtout on NOMME le probleme au lieu de
          # le constater.
          echo "secrets attendus :"
          echo "  OKX_API_KEY        : $( [ -n "$K" ] && echo present || echo VIDE )"
          echo "  OKX_API_SECRET     : $( [ -n "$S" ] && echo present || echo VIDE )"
          echo "  OKX_API_PASSPHRASE : $( [ -n "$P" ] && echo present || echo VIDE )"
          echo "  OKTOKEN (les trois) : $( [ -n "$UN" ] && echo present || echo VIDE )"
          # Le secret unique prend la place de la cle ; le decoupage se
          # fait sur le SERVEUR, pas ici. GitHub masque la valeur EXACTE
          # dun secret, jamais ses morceaux : decouper « a:b:c » de ce
          # cote produirait trois fragments que plus rien ne masquerait.
          if [ -z "$K$S$P" ] && [ -n "$UN" ]; then K="$UN"; S=""; P=""; fi
          if [ -z "$K$S$P" ]; then
            echo
            echo "aucun des trois nest visible. Noms voisins trouves :"
            trouve=0
            for n in OKX_KEY:$V1 OKX_ACCESS_KEY:$V2 OK_ACCESS_KEY:$V3 API_KEY:$V4 \
                     OKX_SECRET:$V5 OKX_PASSPHRASE:$V6 OKX_API_PASS:$V7 ; do
              nom="${n%%:*}"; val="${n#*:}"
              if [ -n "$val" ]; then echo "  -> $nom est renseigne : nom different de celui attendu"; trouve=1; fi
            done
            [ "$trouve" = "0" ] && echo "  aucun."
            echo
            echo "La cause la plus frequente est longlet : la page"
            echo "Settings > Secrets and variables > Actions porte DEUX onglets,"
            echo "Secrets et Variables. Un secret depose dans Variables nest"
            echo "jamais lu par secrets.NOM. Verifier aussi quil sagit de"
            echo "Repository secrets, et non de Dependabot ni Codespaces, qui"
            echo "ont chacun leur propre page."
            exit 1
          fi

          sshpass -e scp -o StrictHostKeyChecking=accept-new \
            deploy/poser_cles.sh "root@$VPS:/tmp/poser_cles.sh"
          # Pas de « ; rm » derriere : le code de retour serait celui du
          # rm, qui reussit toujours, et une pose refusee par OKX se
          # presenterait comme un succes. Le script se supprime lui-meme.
          # La valeur part TELLE QUELLE quand elle vient dun secret unique :
          # ce peut etre un fichier .env entier, une ligne a trois
          # morceaux, ou les trois valeurs separement. Le serveur
          # reconnait la forme — cest lui qui doit le faire, puisque cest
          # lui qui peut decouper sans produire de fragments non masques.
          if [ -n "$UN" ] && [ -z "$S$P" ]; then
            printf '%s\n' "$UN" \
              | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
                "bash /tmp/poser_cles.sh"
          else
            printf '%s\n%s\n%s\n%s\n' "$K" "$S" "$P" "${SIM:-0}" \
              | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
                "bash /tmp/poser_cles.sh"
          fi

      - name: Status report
        if: ${{ !inputs.lien && !inputs.poser_cles }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            bash -s < deploy/etat.sh
