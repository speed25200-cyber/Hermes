# Check Hermes status on the VPS: services, research progress, engine logs,
# deployed strategies and current equity. Trigger manually any time.

name: VPS status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass

      - name: Status report
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "===== services ====="
            systemctl is-active hermes-research && echo "(research still running)" || echo "(research unit idle/done)"
            systemctl is-active hermes || true
            echo
            echo "===== research / engine journal (last 40 lines) ====="
            journalctl -u hermes-research -u hermes -n 40 --no-pager || true
            echo
            echo "===== hermes state ====="
            cd /root/hermes 2>/dev/null && /root/venv/bin/python -m hermes status 2>/dev/null | head -80 || echo "no state yet"
            echo
            echo "===== disk / memory ====="
            df -h / | tail -1; free -m | head -2
          '
