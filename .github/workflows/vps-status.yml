# Did the book start trading after the allocator fix? Reports the orders and
# non-zero targets the engine produced since it restarted, plus whether the
# research pass is still running.

name: VPS status

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass

      - name: Resolve SSH access
        env:
          PW_INPUT: ${{ inputs.root_password }}
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          PW="${PW_INPUT:-$PW_SECRET}"
          [ -z "$PW" ] && { echo "::error::no credentials"; exit 1; }
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"; echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then CUR="$PW"; elif try "$ALT"; then CUR="$ALT"; else
            echo "::error::cannot authenticate"; exit 1; fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Did the book trade?
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "=== research service ==="
            systemctl is-active hermes-research
            echo
            echo "=== orders placed since the engine restarted ==="
            journalctl -u hermes --since "2026-08-16 10:09" --no-pager \
              | grep -c "order " || echo 0
            echo "--- most recent order lines ---"
            journalctl -u hermes --since "2026-08-16 10:09" --no-pager \
              | grep "order " | tail -8 || echo "(none yet)"
            echo
            echo "=== last 3 cycles: equity and non-zero targets ==="
            journalctl -u hermes -n 400 --no-pager | grep "cycle @" | tail -3 \
              | sed -E "s/, .[A-Z]+-USDT-SWAP.: -?0\.0\}?//g; s/, .[A-Z]+-USDT-SWAP.: -?0\.0,/,/g"
          '
