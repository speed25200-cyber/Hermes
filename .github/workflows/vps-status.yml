# Check Hermes status on the VPS: services, research progress, engine logs,
# deployed strategies and current equity. Trigger manually any time.

name: VPS status

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass

      - name: Resolve SSH access
        env:
          PW_INPUT: ${{ inputs.root_password }}
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          PW="${PW_INPUT:-$PW_SECRET}"
          [ -z "$PW" ] && { echo "::error::no credentials"; exit 1; }
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"; echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then CUR="$PW"; elif try "$ALT"; then CUR="$ALT"; else
            echo "::error::cannot authenticate"; exit 1; fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Status report
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "===== services ====="
            systemctl is-active hermes-research && echo "(research running)" || echo "(research idle/done)"
            systemctl is-active hermes || true
            echo -n "dashboard: "; systemctl is-active hermes-dashboard || true
            ss -tln | grep -q ":8899 " && echo "port 8899: LISTENING" || echo "port 8899: NOT listening"
            echo
            echo "===== research / engine journal (last 50 lines) ====="
            journalctl -u hermes-research -u hermes -n 50 --no-pager || true
            echo
            echo "===== deployed book (registry summary) ====="
            grep -E "\"(inst|signal|sharpe|dsr|oos_folds_positive|n_trials|consecutive_empty)\"" /root/hermes/state/registry.json 2>/dev/null || echo "no registry yet"
            echo
            echo "===== hermes state ====="
            cd /root/hermes 2>/dev/null && /root/venv/bin/python -m hermes status 2>/dev/null | head -40 || echo "no state yet"
            echo
            echo "===== disk / memory ====="
            df -h / | tail -1; free -m | head -2
          '

      # Temporary: probe OKX rubik endpoints FROM THE VPS (GitHub runners
      # get geo-blocked 403s from OKX). Removed once the aux fetcher lands.
      - name: Probe OKX aux endpoints (runs on the VPS)
        run: |
          cat > /tmp/probe.py <<'EOF'
          import json, time, urllib.request

          BASE = "https://www.okx.com"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/126.0.0.0 Safari/537.36")

          def get(path, base=None, ua=UA, **params):
              qs = "&".join(f"{k}={v}" for k, v in params.items() if v is not None)
              url = f"{base or BASE}{path}?{qs}"
              req = urllib.request.Request(url, headers={
                  "User-Agent": ua, "Accept": "application/json"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          p = json.load(r)
                      if str(p.get("code")) != "0":
                          print(f"  API code={p.get('code')} msg={p.get('msg')}  [{url}]")
                          return None
                      return p["data"]
                  except Exception as e:
                      print(f"  attempt {attempt}: {e}")
                      time.sleep(2 ** attempt)
              return None

          def fmt_ts(ms):
              return time.strftime("%Y-%m-%d %H:%M", time.gmtime(int(ms) / 1000))

          def ts_of(row):
              return int(row["ts"] if isinstance(row, dict) else row[0])

          def probe(title, path, **params):
              print(f"\n=== {title} ===")
              print(f"    {path} {params}")
              data = get(path, **params)
              if not data:
                  print("  NO DATA")
                  return None
              print(f"  rows={len(data)}")
              print(f"  first row: {json.dumps(data[0])[:300]}")
              print(f"  last  row: {json.dumps(data[-1])[:300]}")
              print(f"  newest={fmt_ts(ts_of(data[0]))}  oldest={fmt_ts(ts_of(data[-1]))}")
              return data

          def depth(title, path, pages=45, **params):
              data = probe(title, path, **params)
              if not data:
                  return
              oldest = ts_of(data[-1])
              for i in range(pages):
                  time.sleep(0.3)
                  nxt = get(path, end=oldest, **params)
                  if not nxt:
                      print(f"  pagination stopped after {i} pages (end={fmt_ts(oldest)})")
                      break
                  o2 = ts_of(nxt[-1])
                  if o2 >= oldest:
                      print(f"  no progress at {fmt_ts(oldest)}; stopping")
                      break
                  oldest = o2
              print(f"  DEEPEST REACHED: {fmt_ts(oldest)}")

          INST = "BTC-USDT-SWAP"
          OI = "/api/v5/rubik/stat/contracts/open-interest-history"
          TK = "/api/v5/rubik/stat/taker-volume-contract"
          LS = "/api/v5/rubik/stat/contracts/long-short-account-ratio-contract"

          # control: does a market endpoint work with the same client?
          probe("CONTROL candles (browser UA)", "/api/v5/market/candles",
                instId=INST, bar="1H", limit=3)
          probe("CONTROL candles (python UA)", "/api/v5/market/candles",
                ua="python-requests/2.31", instId=INST, bar="1H", limit=3)

          # rubik with browser UA on both domains
          probe("OI www + browser UA", OI, instId=INST, period="1H", limit=10)
          probe("OI aws domain", OI, base="https://aws.okx.com",
                instId=INST, period="1H", limit=10)
          probe("OI python UA", OI, ua="python-requests/2.31",
                instId=INST, period="1H", limit=10)

          r1 = get(OI, instId=INST, period="1H", limit=10)
          if r1:
              depth("OI history 1H", OI, instId=INST, period="1H", limit=100)
              depth("Taker volume 1H", TK, instId=INST, period="1H", limit=100)
              depth("Long/short ratio 1H", LS, instId=INST, period="1H", limit=100)
              probe("Top-trader L/S position", "/api/v5/rubik/stat/contracts/"
                    "long-short-position-ratio-contract-top-trader",
                    instId=INST, period="1H", limit=30)
              probe("OI alt (NEAR)", OI, instId="NEAR-USDT-SWAP", period="1H", limit=10)
              probe("Taker alt (NEAR)", TK, instId="NEAR-USDT-SWAP", period="1H", limit=10)
              probe("LSR alt (NEAR)", LS, instId="NEAR-USDT-SWAP", period="1H", limit=10)

          print("\nprobe complete")
          EOF
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/probe.py "root@$VPS:/tmp/probe.py"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" "python3 /tmp/probe.py"
