name: Hermes quality gate

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Syntax and safety contracts
        run: npm run check && npm test

      - name: Repository-wide syntax contracts
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile() && entry.name.endsWith('.json')) JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, ''));
            }
          }
          walk('.');
          NODE

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
