# Deploy Hermes to the VPS over SSH, from a GitHub runner.
#
# Authentication (either works):
#   - VPS_PASSWORD repository secret, or
#   - root_password workflow input (bootstrap convenience).
# First-login handling: Hetzner marks the emailed root password as expired.
# The resolve step detects this, performs the forced change over a forced
# TTY, and rotates to "<original>.Hermes1" — subsequent runs try both forms
# automatically, so the original password remains the only thing to know.
#
# Etapes : rsync du depot vers /root/hermes, puis deploy/install.sh.
#
# Il ny a plus quune seule etape de mise en ligne, la ou il y en avait
# trois. Lancien moteur Python lancait derriere lui une passe de
# recherche qui laissait le trading ARRETE pendant tout son travail —
# mesure le 27 aout, une heure trente-sept. Astra apporte des strategies
# deja validees et na donc pas de passe a lancer : linstalleur relance
# le service et cest fini. Le choix full/code, qui existait uniquement
# pour contourner ce piege, na plus dobjet.
#
# Utiliser « VPS status » pour verifier ensuite.

name: Deploy Hermes to VPS

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false
      paquet:
        description: "Paquet chiffre portant les lignes OKX (base64). Vide = ne rien poser."
        required: false
        default: ""
      demarrer:
        description: "Demarrer le moteur apres la pose des cles"
        required: false
        default: "false"
      diagnostic:
        description: "Mesurer sur OKX ce que le capital peut ouvrir (aucune ecriture)"
        required: false
        default: "false"
      chercher:
        description: "Lancer la recherche de perles maintenant et afficher le verdict"
        required: false
        default: "false"
      banc_regime:
        description: "Mesurer si le filtre par etat de marche ameliore les perles (aucune ecriture)"
        required: false
        default: "false"
      histoire:
        description: "Telecharger des mois d'archives publiques pour mesurer sur un vrai retournement"
        required: false
        default: "false"
      mois:
        description: "Nombre de mois d'archives a telecharger (12 par defaut, 36 pour un vrai cycle de marche)"
        required: false
        default: "12"
      extra:
        description: "Telecharger financement et interet ouvert (donnees que le prix ne contient pas)"
        required: false
        default: "false"
      transversal:
        description: "Essayer le classement transversal entre instruments (momentum, retournement, financement)"
        required: false
        default: "false"
      hors_echantillon:
        description: "Relever l'hypothese pre-inscrite du 2 septembre sur les seules donnees posterieures"
        required: false
        default: "false"
      balayage:
        description: "Balayer trente-six reglages de seuils du regime et montrer la sensibilite"
        required: false
        default: "false"
      banc_chercheur:
        description: "Rejouer le PROCEDE de selection en glissade sur un an (la mesure decisive)"
        required: false
        default: "false"
      frais:
        description: "Compter la part reelle d'entrees maker dans le journal du moteur"
        required: false
        default: "false"
      aleatoire:
        description: "Melanger les journees avant de mesurer : l'etalon de ce que le hasard rapporte"
        required: false
        default: "false"
      horizon_long:
        description: "Essayer des cibles plus grandes et plus rares (TP 1,2 a 2,5 de marge, tenue 48 a 96 h)"
        required: false
        default: "false"
      signaux:
        description: "Grille de signaux du banc : vide = les treize actuels, 'suite' = les six de tendance, 'tout' = les dix-neuf"
        required: false
        default: ""
      pas_jours:
        description: "Jours entre deux reselections dans le banc du procede (21 par defaut, 7 = plus proche du vivant)"
        required: false
        default: "21"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Une premiere passe froide sur cinquante instruments peut approcher la demi-heure.
    timeout-minutes: 45
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass rsync

      - name: Resolve SSH access (handles first-login password change)
        env:
          PW_INPUT: ${{ inputs.root_password }}
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          PW="${PW_INPUT:-$PW_SECRET}"
          if [ -z "$PW" ]; then
            echo "::error::no credentials: set the VPS_PASSWORD secret or pass root_password input"
            exit 1
          fi
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"
          echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { timeout 25 sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then
            CUR="$PW"; echo "auth: original password works"
          elif try "$ALT"; then
            CUR="$ALT"; echo "auth: rotated password works"
          else
            echo "auth: attempting forced expired-password change (pexpect)..."
            pip install -q pexpect
            python3 - "$VPS" "$PW" "$ALT" <<'PYEOF'
          import sys, pexpect
          host, pw, alt = sys.argv[1], sys.argv[2], sys.argv[3]
          c = pexpect.spawn(
              f"ssh -tt -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@{host}",
              encoding="utf-8", timeout=40)
          c.logfile_read = None  # never echo remote output (may contain prompts)
          sent_new = 0
          while True:
              i = c.expect([
                  r"[Pp]assword:",                  # 0 login or current password
                  r"[Cc]urrent.*password.*?:",      # 1 current password (chauthtok)
                  r"[Nn]ew.*password.*?:",          # 2 new password (and retype)
                  r"[#$]\s*$",                      # 3 shell prompt -> done
                  pexpect.EOF,                      # 4
              ])
              if i in (0, 1):
                  c.sendline(pw)
              elif i == 2:
                  c.sendline(alt); sent_new += 1
              elif i == 3:
                  c.sendline("exit")
                  c.expect(pexpect.EOF)
                  break
              else:
                  break
          print(f"dialogue done (new password sent {sent_new}x)")
          PYEOF
            sleep 3
            if try "$ALT"; then
              CUR="$ALT"; echo "auth: password rotated successfully"
            elif try "$PW"; then
              CUR="$PW"; echo "auth: original password still valid"
            else
              echo "::error::cannot authenticate to $VPS with any known form"
              exit 1
            fi
          fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Copy repository to VPS
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "command -v rsync >/dev/null || (apt-get update -qq && apt-get -y -qq install rsync); mkdir -p /root/hermes"
          # /.env holds the dashboard token and any exchange credentials.
          # It exists only on the box, so --delete removed it on every deploy
          # and the installer then minted a fresh token — silently locking the
          # owner out of their own dashboard each time.
          # node_modules se reinstalle sur la machine par linstalleur :
          # lenvoyer, ce serait pousser des binaires compiles pour une
          # autre architecture que celle qui les executera.
          # logs et runtime sont ecrits par le moteur en marche ; --delete
          # les effacerait a chaque mise en ligne.
          # config/roster.json est ecrit par le chercheur de perles SUR la
          # machine : sans cette exclusion, chaque mise en ligne
          # ecraserait le verdict le plus recent.
          sshpass -e rsync -az --delete \
            --exclude '/.git' --exclude '/state' --exclude '/data' \
            --exclude '/.env' --exclude '/node_modules' \
            --exclude '/logs' --exclude '/runtime' \
            --exclude '/config/roster.json' --exclude '/banc' --exclude '/recherche' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "root@$VPS:/root/hermes/"

      - name: Run installer
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "bash /root/hermes/deploy/install.sh"

      # --- Pose des cles OKX -------------------------------------------
      #
      # Ces trois etapes vivraient mieux dans un workflow separe, et
      # elles y ont dabord ete ecrites. GitHub ne declenche que les
      # workflows presents sur la branche par defaut : un fichier neuf
      # sur une branche de travail renvoie 404 a la demande. Elles sont
      # donc ici, conditionnees a la presence dun paquet — sans paquet,
      # ce workflow se comporte exactement comme avant.
      #
      # Le paquet arrive CHIFFRE. La page dun run affiche ses entrees ;
      # le depot est prive, donc cette page nest pas publique, mais la
      # verification na ete faite quapres coup et le chiffrement reste
      # : il ne coute rien, et il retire la question du chemin. Une cle
      # en clair dans une entree de workflow depend, pour rester
      # discrete, dun reglage de visibilite quil suffit de changer.
      #
      # Ce que le champ porte est un bloc AES-256-GCM, ouvrable par la
      # seule machine qui detient HERMES_DASH_TOKEN — le serveur.
      - name: Deposer louvreur de paquet
        if: ${{ inputs.paquet != '' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "cat > /tmp/ouvrir_paquet.js && chmod 600 /tmp/ouvrir_paquet.js" \
            < deploy/ouvrir_paquet.js

      - name: Ouvrir le paquet et poser les cles
        if: ${{ inputs.paquet != '' }}
        env:
          PAQUET: ${{ inputs.paquet }}
        run: |
          # PAQUET passe par lenvironnement et nest jamais interpole
          # dans le corps du script : une valeur collee la serait une
          # injection de commande qui attend son heure.
          #
          # printf est une primitive du shell — pas de processus fils,
          # donc rien a lire dans la liste des processus du runner.
          printf '%s' "$PAQUET" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            set -o pipefail
            node /tmp/ouvrir_paquet.js | bash /root/hermes/deploy/poser_cles.sh
            code=$?
            rm -f /tmp/ouvrir_paquet.js
            exit $code
          '
          # Le rm vient APRES la capture du code. Ecrit « commande ; rm »,
          # le pas-a-pas renverrait le code du rm — qui reussit toujours —
          # et un echec de pose se presenterait comme un succes. Ce piege
          # a deja fait passer un workflow en vert sur un echec.

      # Le demarrage ne depend plus de la presence dun paquet : une fois
      # les cles posees, on veut pouvoir relancer le moteur sans les
      # reposer. Il reste conditionne a un echec de letape precedente,
      # que GitHub applique tout seul — demarrer un moteur dont la pose
      # vient dechouer nouvrirait rien et masquerait la vraie panne.
      - name: Demarrer le moteur
        if: ${{ inputs.demarrer == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            TOK=$(grep "^HERMES_DASH_TOKEN=" /root/hermes/.env | tail -1 | cut -d= -f2-)
            if [ -z "$TOK" ]; then
              echo "!! pas de jeton dans le .env : impossible dappeler la console"
              exit 1
            fi
            # La cle est envoyee a curl par un fichier de configuration
            # lu sur lentree standard, jamais en argument : un argument
            # est visible dans la liste des processus le temps que la
            # commande vive. echo est une primitive du shell, donc ces
            # lignes ne creent aucun processus ou la lire, et rien
            # natterrit sur un disque.
            #
            # La valeur de data est laissee SANS guillemets : curl prend
            # alors la ligne telle quelle jusqua sa fin, et le JSON na
            # pas a etre echappe a travers trois couches de citation —
            # exercice ou lerreur ne se voit qua lexecution.
            r=$({
              echo "url = \"http://127.0.0.1:8899/api/toggle-ai?key=$TOK\""
              echo "request = \"POST\""
              echo "header = \"Content-Type: application/json\""
              echo "data = {\"arg\":true}"
            } | curl -s --max-time 20 --noproxy "*" --config -)
            echo "  reponse du moteur : $r"
            # On cherche le champ EXACT. Un motif large comme
            # *active*true* accepterait aussi une reponse ou active
            # vaut false et ou le mot true apparait ailleurs — et le
            # workflow passerait au vert sur un moteur a larret.
            if printf "%s" "$r" | grep -q "\"active\":true"; then
              echo "  le moteur est DEMARRE"
            else
              echo "  !! le moteur na pas confirme son demarrage"
              exit 1
            fi
          '

      # always() : cest quand une etape a echoue quon a le plus besoin
      # de letat de la machine. Saute sur echec, ce releve ne servait
      # qua confirmer les succes.
      - name: Snapshot status
        if: always()
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "=== service ==="; systemctl is-active hermes || true
            echo "=== port 8899 ==="
            ss -tln | grep -q ":8899 " && echo LISTENING || echo "NOT listening"
            echo "=== dashboard ==="
            # La cle nest PAS imprimee. Le depot est prive — verifie
            # par lAPI, visibility: private — donc ce journal nest
            # lisible que par son proprietaire, et limprimer nest pas
            # une fuite publique. Ce nest pas une raison de le faire :
            # cette cle commande un moteur regle en pilotage complet,
            # la lire suffit pour demarrer, arreter et passer un ordre,
            # et un journal de run se partage par un lien sans quon
            # pense a ce quil contient.
            #
            # Ce quon imprime a la place repond a la seule question
            # quon se pose ici — la cle existe-t-elle — sans repondre a
            # celle quon ne veut pas voir posee.
            if [ -f /root/hermes/.env ] && grep -q "^HERMES_DASH_TOKEN=.\+" /root/hermes/.env; then
              echo "  cle presente. Ladresse est http://178.104.191.79:8899/?key=<votre cle>"
            else
              echo "  !! aucune cle de tableau de bord dans le .env"
            fi
            echo "=== journal ==="; journalctl -u hermes -n 30 --no-pager || true
          '

      - name: Chercher les perles maintenant
        if: ${{ inputs.chercher == 'true' }}
        run: |
          # La meme commande que le minuteur systemd, lancee a la main :
          # le verdict complet arrive dans ce journal de run.
          # ServerAlive : la recherche a des silences de plusieurs minutes,
          # et un SSH muet se fait couper en chemin — la premiere passe
          # est morte d'un Broken pipe a la 5e minute, pas d'une erreur.
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS=--dns-result-order=ipv4first HERMES_UNIVERSE_SIZE=50 node deploy/chercher_perles.js"

      # Un mois de bougies ne contient pas de retournement de marche, et
      # le premier passage du banc l'a montre : 87 % du temps en
      # fourchette, sept trades ecartes sur trois cent vingt-huit. Cette
      # etape va chercher des mois d'archives publiques Binance — un zip
      # par mois et par instrument, sans compte ni cle — pour que la
      # mesure porte sur une periode qui contient le probleme qu'on
      # cherche a traiter. Elle n'ecrit que dans data/cache-long, exclu
      # du rsync.
      - name: Telecharger l'histoire longue
        if: ${{ inputs.histoire == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@$VPS" \
            "cd /root/hermes && df -h / | tail -1 && NODE_OPTIONS=--dns-result-order=ipv4first HISTOIRE_MOIS='${{ inputs.mois }}' node deploy/histoire_longue.js && du -sh data/cache-long && df -h / | tail -1"

      # Les series que le prix ne contient pas : taux de financement et
      # interet ouvert. Douze mois de mesures ont montre que les bougies
      # seules ne portent aucun avantage exploitable ; ces deux series
      # mesurent le POSITIONNEMENT, pas le prix, et c'est la seule piste
      # que la litterature soutient encore. Archives publiques, aucune
      # cle, ecriture dans data/extra seulement.
      - name: Telecharger financement et interet ouvert
        if: ${{ inputs.extra == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS=--dns-result-order=ipv4first HISTOIRE_MOIS='${{ inputs.mois }}' node deploy/histoire_extra.js && du -sh data/extra"

      # Le banc transversal. Douze mois de mesures ont ferme la question
      # « cet instrument va-t-il monter ? ». Celui-ci en pose une autre :
      # « parmi trente instruments, lesquels vont faire mieux que les
      # autres ? ». Le mouvement commun a toute la crypto s'annule entre
      # le cote long et le cote court, et il ne reste que l'asymetrie
      # relative — la seule piste que la litterature soutient encore.
      - name: Essayer le classement transversal
        if: ${{ inputs.transversal == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS='--dns-result-order=ipv4first --max-old-space-size=1400' TRANSVERSAL_MOIS_MIN='${{ inputs.mois }}' node deploy/banc_transversal.js"

      # Le suivi hors echantillon. Le banc transversal a vu ses vingt et
      # une cellules avant de conclure, et paie cette liberte par une
      # correction qui lui a coute son verdict. Une hypothese a ete
      # ecrite le 2 septembre 2026, avant les donnees qui la jugeront ;
      # ce releve la mesure sur ces donnees-la et sur aucune autre. Il
      # n'a aucun reglage : c'est tout son interet. Il dit aussi combien
      # de temps il faudra encore, ce qui est la seule facon de ne pas
      # lire un verdict dans trois mois de bruit.
      #
      # L'etape rafraichit les archives AVANT de mesurer, sinon le releve
      # relirait eternellement les memes mois en ayant l'air de marcher.
      # Les deux telechargements ne prennent que ce qui manque : sur un
      # cache a jour ils ne font rien, et au premier du mois ils prennent
      # le mois qui vient de se clore.
      - name: Relever l'hypothese pre-inscrite
        if: ${{ inputs.hors_echantillon == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS='--dns-result-order=ipv4first --max-old-space-size=1400' HISTOIRE_MOIS=24 EXTRA_BUDGET_S=600 node deploy/histoire_longue.js && NODE_OPTIONS='--dns-result-order=ipv4first' HISTOIRE_MOIS=24 EXTRA_BUDGET_S=600 node deploy/histoire_extra.js && NODE_OPTIONS='--dns-result-order=ipv4first --max-old-space-size=1400' node deploy/hors_echantillon.js"

      # Le banc du regime. Il rejoue les perles du roster sur le cache du
      # chercheur, avec et sans le filtre par etat de marche, en
      # validation glissante, et compare a un temoin de retraits au
      # hasard. Il n'ecrit rien et ne touche a aucun ordre : c'est la
      # mesure qui decide si la couche merite d'etre cablee.
      - name: Mesurer le filtre par etat de marche
        if: ${{ inputs.banc_regime == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS=--dns-result-order=ipv4first REGIME_BALAYAGE=${{ inputs.balayage == 'true' && '1' || '0' }} node deploy/banc_regime.js"

      # Les frais sont le premier suspect : a levier 15, deux jambes taker
      # a 0,05 % coutent 1,5 % de marge par trade, et le banc sur douze
      # mois montre une perte du meme ordre. Le moteur tente deja une
      # entree MAKER (limite post-only, cinq secondes, repli marche) —
      # cette etape compte ce que cette tentative rapporte VRAIMENT, en
      # lisant le journal. Aucune cle, aucune ecriture.
      - name: Compter les entrees maker
        if: ${{ inputs.frais == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "=== entrees par voie, depuis le debut du journal ==="
            journalctl -u hermes --no-pager -o cat | grep -o "entree:\"[a-zé]*\"" | sort | uniq -c || true
            echo "=== refus de la limite post-only (MAKER_MISS) ==="
            journalctl -u hermes --no-pager -o cat | grep -c "MAKER_MISS" || true
            echo "=== dernieres raisons de refus ==="
            journalctl -u hermes --no-pager -o cat | grep "MAKER_MISS" | tail -5 || true
            echo "=== taux de frais du compte vus par le moteur ==="
            journalctl -u hermes --no-pager -o cat | grep -o "makerFee[^,]*" | tail -3 || true
          '

      # La mesure decisive. Le banc du regime juge un roster FIGE ; celui-ci
      # juge le PROCEDE : a chaque point de la glissade, on relance le vrai
      # juge du chercheur sur les trente jours qui precedent, on trade ses
      # perles sur les trois semaines qui suivent, on recommence. Si ce
      # bras-la est negatif, aucune couche posee par-dessus n'a de sens.
      - name: Rejouer le procede de selection sur un an
        if: ${{ inputs.banc_chercheur == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "root@$VPS" \
            "cd /root/hermes && NODE_OPTIONS='--dns-result-order=ipv4first --max-old-space-size=1400' BANC_PAS_JOURS='${{ inputs.pas_jours }}' BANC_ALEATOIRE=${{ inputs.aleatoire == 'true' && '1' || '0' }} PERLES_SIGNAUX='${{ inputs.signaux }}' BANC_HORIZON_LONG=${{ inputs.horizon_long == 'true' && '1' || '0' }} node deploy/banc_chercheur.js"

      # Mesure, jamais ecriture. Elle interroge les points PUBLICS dOKX
      # depuis le VPS — la seule machine du circuit qui puisse les
      # joindre — et repond a une question quon ne peut pas deviner :
      # un perpetuel sachete par contrats entiers, et la valeur dun
      # contrat varie dun facteur mille dun instrument a lautre.
      - name: Mesurer ce que le capital peut ouvrir
        if: ${{ inputs.diagnostic == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            eq=$(journalctl -u hermes -n 400 --no-pager 2>/dev/null \
                 | grep -o "\[TAILLE\] equite [0-9.]*" | tail -1 | awk "{print \$3}")
            [ -z "$eq" ] && eq=0
            echo "equite lue dans le journal : $eq"
            node /root/hermes/deploy/accessibles.js "$eq"
          '
