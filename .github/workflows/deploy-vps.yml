# Deploy Hermes to the VPS over SSH, from a GitHub runner.
#
# Authentication (either works):
#   - VPS_PASSWORD repository secret, or
#   - root_password workflow input (bootstrap convenience).
# First-login handling: Hetzner marks the emailed root password as expired.
# The resolve step detects this, performs the forced change over a forced
# TTY, and rotates to "<original>.Hermes1" — subsequent runs try both forms
# automatically, so the original password remains the only thing to know.
#
# Etapes : rsync du depot vers /root/hermes, puis deploy/install.sh.
#
# Il ny a plus quune seule etape de mise en ligne, la ou il y en avait
# trois. Lancien moteur Python lancait derriere lui une passe de
# recherche qui laissait le trading ARRETE pendant tout son travail —
# mesure le 27 aout, une heure trente-sept. Astra apporte des strategies
# deja validees et na donc pas de passe a lancer : linstalleur relance
# le service et cest fini. Le choix full/code, qui existait uniquement
# pour contourner ce piege, na plus dobjet.
#
# Utiliser « VPS status » pour verifier ensuite.

name: Deploy Hermes to VPS

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: "Root password (optional if VPS_PASSWORD secret is set)"
        required: false
      paquet:
        description: "Paquet chiffre portant les lignes OKX (base64). Vide = ne rien poser."
        required: false
        default: ""
      demarrer:
        description: "Demarrer le moteur apres la pose des cles"
        required: false
        default: "false"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS: ${{ vars.VPS_HOST || '178.104.191.79' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ssh tooling
        run: sudo apt-get update -qq && sudo apt-get -y -qq install sshpass rsync

      - name: Resolve SSH access (handles first-login password change)
        env:
          PW_INPUT: ${{ inputs.root_password }}
          PW_SECRET: ${{ secrets.VPS_PASSWORD }}
        run: |
          PW="${PW_INPUT:-$PW_SECRET}"
          if [ -z "$PW" ]; then
            echo "::error::no credentials: set the VPS_PASSWORD secret or pass root_password input"
            exit 1
          fi
          ALT="${PW}.Hermes1"
          echo "::add-mask::$PW"
          echo "::add-mask::$ALT"
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          try() { timeout 25 sshpass -p "$1" ssh $SSHOPTS "root@$VPS" "echo __ok__" 2>/dev/null | grep -q __ok__; }
          if try "$PW"; then
            CUR="$PW"; echo "auth: original password works"
          elif try "$ALT"; then
            CUR="$ALT"; echo "auth: rotated password works"
          else
            echo "auth: attempting forced expired-password change (pexpect)..."
            pip install -q pexpect
            python3 - "$VPS" "$PW" "$ALT" <<'PYEOF'
          import sys, pexpect
          host, pw, alt = sys.argv[1], sys.argv[2], sys.argv[3]
          c = pexpect.spawn(
              f"ssh -tt -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@{host}",
              encoding="utf-8", timeout=40)
          c.logfile_read = None  # never echo remote output (may contain prompts)
          sent_new = 0
          while True:
              i = c.expect([
                  r"[Pp]assword:",                  # 0 login or current password
                  r"[Cc]urrent.*password.*?:",      # 1 current password (chauthtok)
                  r"[Nn]ew.*password.*?:",          # 2 new password (and retype)
                  r"[#$]\s*$",                      # 3 shell prompt -> done
                  pexpect.EOF,                      # 4
              ])
              if i in (0, 1):
                  c.sendline(pw)
              elif i == 2:
                  c.sendline(alt); sent_new += 1
              elif i == 3:
                  c.sendline("exit")
                  c.expect(pexpect.EOF)
                  break
              else:
                  break
          print(f"dialogue done (new password sent {sent_new}x)")
          PYEOF
            sleep 3
            if try "$ALT"; then
              CUR="$ALT"; echo "auth: password rotated successfully"
            elif try "$PW"; then
              CUR="$PW"; echo "auth: original password still valid"
            else
              echo "::error::cannot authenticate to $VPS with any known form"
              exit 1
            fi
          fi
          echo "SSHPASS=$CUR" >> "$GITHUB_ENV"

      - name: Copy repository to VPS
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "command -v rsync >/dev/null || (apt-get update -qq && apt-get -y -qq install rsync); mkdir -p /root/hermes"
          # /.env holds the dashboard token and any exchange credentials.
          # It exists only on the box, so --delete removed it on every deploy
          # and the installer then minted a fresh token — silently locking the
          # owner out of their own dashboard each time.
          # node_modules se reinstalle sur la machine par linstalleur :
          # lenvoyer, ce serait pousser des binaires compiles pour une
          # autre architecture que celle qui les executera.
          # logs et runtime sont ecrits par le moteur en marche ; --delete
          # les effacerait a chaque mise en ligne.
          sshpass -e rsync -az --delete \
            --exclude '/.git' --exclude '/state' --exclude '/data' \
            --exclude '/.env' --exclude '/node_modules' \
            --exclude '/logs' --exclude '/runtime' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "root@$VPS:/root/hermes/"

      - name: Run installer
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "bash /root/hermes/deploy/install.sh"

      # --- Pose des cles OKX -------------------------------------------
      #
      # Ces trois etapes vivraient mieux dans un workflow separe, et
      # elles y ont dabord ete ecrites. GitHub ne declenche que les
      # workflows presents sur la branche par defaut : un fichier neuf
      # sur une branche de travail renvoie 404 a la demande. Elles sont
      # donc ici, conditionnees a la presence dun paquet — sans paquet,
      # ce workflow se comporte exactement comme avant.
      #
      # Le paquet arrive CHIFFRE. La page dun run affiche ses entrees et
      # ce depot est public : une cle deposee la serait lisible par
      # tout le monde, ce qui est laccident deja survenu ici une fois.
      # Ce que le champ porte est un bloc AES-256-GCM, ouvrable par la
      # seule machine qui detient HERMES_DASH_TOKEN — le serveur.
      - name: Deposer louvreur de paquet
        if: ${{ inputs.paquet != '' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" \
            "cat > /tmp/ouvrir_paquet.js && chmod 600 /tmp/ouvrir_paquet.js" \
            < deploy/ouvrir_paquet.js

      - name: Ouvrir le paquet et poser les cles
        if: ${{ inputs.paquet != '' }}
        env:
          PAQUET: ${{ inputs.paquet }}
        run: |
          # PAQUET passe par lenvironnement et nest jamais interpole
          # dans le corps du script : une valeur collee la serait une
          # injection de commande qui attend son heure.
          #
          # printf est une primitive du shell — pas de processus fils,
          # donc rien a lire dans la liste des processus du runner.
          printf '%s' "$PAQUET" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            set -o pipefail
            node /tmp/ouvrir_paquet.js | bash /root/hermes/deploy/poser_cles.sh
            code=$?
            rm -f /tmp/ouvrir_paquet.js
            exit $code
          '
          # Le rm vient APRES la capture du code. Ecrit « commande ; rm »,
          # le pas-a-pas renverrait le code du rm — qui reussit toujours —
          # et un echec de pose se presenterait comme un succes. Ce piege
          # a deja fait passer un workflow en vert sur un echec.

      - name: Demarrer le moteur
        if: ${{ inputs.paquet != '' && inputs.demarrer == 'true' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            TOK=$(grep "^HERMES_DASH_TOKEN=" /root/hermes/.env | tail -1 | cut -d= -f2-)
            if [ -z "$TOK" ]; then
              echo "!! pas de jeton dans le .env : impossible dappeler la console"
              exit 1
            fi
            # La cle est envoyee a curl par un fichier de configuration
            # lu sur lentree standard, jamais en argument : un argument
            # est visible dans la liste des processus le temps que la
            # commande vive. echo est une primitive du shell, donc ces
            # lignes ne creent aucun processus ou la lire, et rien
            # natterrit sur un disque.
            #
            # La valeur de data est laissee SANS guillemets : curl prend
            # alors la ligne telle quelle jusqua sa fin, et le JSON na
            # pas a etre echappe a travers trois couches de citation —
            # exercice ou lerreur ne se voit qua lexecution.
            r=$({
              echo "url = \"http://127.0.0.1:8899/api/toggle-ai?key=$TOK\""
              echo "request = \"POST\""
              echo "header = \"Content-Type: application/json\""
              echo "data = {\"arg\":true}"
            } | curl -s --max-time 20 --noproxy "*" --config -)
            echo "  reponse du moteur : $r"
            # On cherche le champ EXACT. Un motif large comme
            # *active*true* accepterait aussi une reponse ou active
            # vaut false et ou le mot true apparait ailleurs — et le
            # workflow passerait au vert sur un moteur a larret.
            if printf "%s" "$r" | grep -q "\"active\":true"; then
              echo "  le moteur est DEMARRE"
            else
              echo "  !! le moteur na pas confirme son demarrage"
              exit 1
            fi
          '

      - name: Snapshot status
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$VPS" '
            echo "=== service ==="; systemctl is-active hermes || true
            echo "=== port 8899 ==="
            ss -tln | grep -q ":8899 " && echo LISTENING || echo "NOT listening"
            echo "=== dashboard ==="
            if [ -f /root/hermes/.env ]; then
              TOK=$(grep "^HERMES_DASH_TOKEN=" /root/hermes/.env | tail -1 | cut -d= -f2-)
              [ -n "$TOK" ] && echo "url: http://178.104.191.79:8899/?key=$TOK"
            fi
            echo "=== journal ==="; journalctl -u hermes -n 30 --no-pager || true
          '
