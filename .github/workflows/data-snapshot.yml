# Pull a full OKX market-data snapshot on a GitHub runner (public endpoints,
# no keys) and publish it as gzipped CSV on the orphan branch
# `okx-data-snapshot`, so research can be reproduced anywhere — including
# sandboxes that cannot reach the exchange directly.

name: OKX data snapshot

on:
  # push-triggered so it can run from a feature branch before the file
  # exists on the default branch (workflow_dispatch needs that)
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/data-snapshot.yml"]
  workflow_dispatch:
    inputs:
      days:
        description: "history depth in days"
        required: false
        default: "730"
      bars:
        description: "comma-separated bars"
        required: false
        default: "1H,15m"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    # one publisher per target branch; different snapshots run in parallel
    concurrency:
      group: ${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2y-1H-15m
            days: "730"
            bars: "1H,15m"
            branch: okx-data-snapshot
          - name: 5y-1H
            days: "1825"
            bars: "1H"
            branch: okx-data-snapshot-1h-5y
          - name: 5y-1H-lite          # candles + funding only: fast
            days: "1825"
            bars: "1H"
            micro: "0"
            branch: okx-data-snapshot-1h-5y-lite
          - name: top60-3y-1H         # broad universe: top-60 USDT perps by 24h volume
            days: "1095"
            bars: "1H"
            micro: "0"
            universe: "60"
            branch: okx-data-snapshot-top60-1h-3y
    steps:
      - uses: actions/checkout@v4

      - name: Skip targets that are already published (push runs only rebuild new ones)
        id: chk
        env:
          SNAP_BRANCH: ${{ matrix.branch }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git ls-remote --exit-code --heads origin "$SNAP_BRANCH" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "$SNAP_BRANCH already published — skipping"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: steps.chk.outputs.skip != '1'

      - name: Install dependencies
        if: steps.chk.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Backfill candles + funding + microstructure
        if: steps.chk.outputs.skip != '1'
        env:
          DAYS: ${{ inputs.days || matrix.days }}
          BARS: ${{ inputs.bars || matrix.bars }}
          MICRO: ${{ matrix.micro || '1' }}
          UNIVERSE: ${{ matrix.universe || '' }}
        run: |
          python - <<'PY'
          import os, time
          from hermes.config import Config
          from hermes.data.store import DataStore
          from hermes.data.fetcher import (fetch_candles, fetch_funding,
                                           fetch_microstructure)
          from hermes.exchange.okx_client import OKXClient
          cfg = Config.load()
          days = int(os.environ.get("DAYS") or 730)
          bars = [b.strip() for b in (os.environ.get("BARS") or "1H").split(",") if b.strip()]
          store = DataStore("data")
          client = OKXClient(cfg.credentials)
          t0 = time.time()
          insts = list(cfg["instruments"])
          uni = os.environ.get("UNIVERSE") or ""
          if uni:
              from hermes.scalp.universe import select_universe
              ticks = client.swap_tickers()
              insts = select_universe(ticks, n=int(uni), max_spread_bps=10.0,
                                      min_vol_usd=10e6)
              print(f"universe: top {len(insts)} by 24h volume: {insts}")
              import json
              os.makedirs("snapshot", exist_ok=True)
              with open("snapshot/universe.json", "w") as f:
                  json.dump({"instruments": insts, "selected_at": time.time(),
                             "vol_usd": {i: ticks[i]["vol_usd"] for i in insts}}, f, indent=1)
          for inst in insts:
              for bar in bars:
                  try:
                      fetch_candles(client, store, inst, bar, days, log=print)
                  except Exception as exc:
                      print(f"{inst} {bar}: FAILED {type(exc).__name__}: {exc}")
              try:
                  fetch_funding(client, store, inst, days, log=print)
              except Exception as exc:
                  print(f"{inst} funding: FAILED {type(exc).__name__}: {exc}")
              if os.environ.get("MICRO", "1") == "1":
                  try:
                      fetch_microstructure(client, store, inst, "15m",
                                           days=min(days, 180), log=print)
                  except Exception as exc:
                      print(f"{inst} micro: FAILED {type(exc).__name__}: {exc}")
              print(f"--- {inst} done ({time.time() - t0:.0f}s)")
          PY

      - name: Export tables to gzipped CSV
        if: steps.chk.outputs.skip != '1'
        run: |
          python - <<'PY'
          import csv, gzip, os, sqlite3, time
          con = sqlite3.connect("data/market.db")
          os.makedirs("snapshot", exist_ok=True)
          tables = {
              "candles": "SELECT inst, bar, ts, o, h, l, c, v FROM candles ORDER BY inst, bar, ts",
              "funding": "SELECT inst, ts, rate FROM funding ORDER BY inst, ts",
              "oi": "SELECT inst, ts, oi FROM oi ORDER BY inst, ts",
              "flow": "SELECT inst, ts, buy, sell FROM flow ORDER BY inst, ts",
              "mark_px": "SELECT inst, bar, ts, px FROM mark_px ORDER BY inst, bar, ts",
              "index_px": "SELECT inst, bar, ts, px FROM index_px ORDER BY inst, bar, ts",
          }
          for name, sql in tables.items():
              cur = con.execute(sql)
              cols = [d[0] for d in cur.description]
              n = 0
              with gzip.open(f"snapshot/{name}.csv.gz", "wt", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(cols)
                  for row in cur:
                      w.writerow(row)
                      n += 1
              print(f"{name}: {n} rows")
          with open("snapshot/README.md", "w") as f:
              f.write("OKX market snapshot exported "
                      + time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                      + "\n\nImport with `python -m hermes import-snapshot <dir>`.\n")
          PY
          ls -la snapshot

      - name: Publish to orphan branch
        if: steps.chk.outputs.skip != '1'
        env:
          SNAP_BRANCH: ${{ matrix.branch }}
        run: |
          set -e
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          cp -r snapshot/. /tmp/snap/
          git checkout --orphan "$SNAP_BRANCH"
          git rm -rf --quiet . || true
          git clean -fdxq || true
          cp -r /tmp/snap/. .
          git add -A
          git commit -m "OKX data snapshot $(date -u +%FT%TZ)"
          git push -f origin "$SNAP_BRANCH"

      - name: Upload artifact (backup)
        if: steps.chk.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: okx-snapshot-${{ matrix.name }}
          path: snapshot
          retention-days: 7
