# Hermes — hourly trading cycle on GitHub Actions.
#
# How it works: Hermes trades 1H bars, so one decision cycle per hour fits
# the Actions execution model — wake, decide, persist, exit. Market data is
# kept in the Actions cache; trading state (registry, risk, journal) is
# committed back to the repo so every run resumes where the last one ended.
#
# Setup:
#   1. Use a PRIVATE repository (the journal contains your equity/trades).
#   2. Secrets (Settings > Secrets and variables > Actions > Secrets):
#        OKX_API_KEY / OKX_API_SECRET / OKX_API_PASSPHRASE
#      Create the OKX key with TRADE permission only — never withdrawal.
#   3. Variables (same page, "Variables" tab):
#        HERMES_MODE      paper (default) | live
#        OKX_SIMULATED    1 (default, OKX demo-trading) | 0 (real orders)
#   4. Run the "Hermes research" workflow once to deploy strategies.
#
# Honest limits vs an always-on VPS:
#   - cron fires with minutes of jitter and runs are occasionally skipped;
#   - NOBODY watches positions between two hourly runs — the risk engine's
#     kill switch only evaluates when a cycle runs (a VPS polls every 20 s);
#   - GitHub runner IPs rotate, so the OKX key cannot be IP-allowlisted.
# Paper trading and cautious small live sizes only; prefer a VPS for more.

name: Hermes trade cycle

on:
  schedule:
    - cron: "7 * * * *"     # hh:07 — after the 1H candle closes/confirms
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-trading      # never two cycles at once
  cancel-in-progress: false

jobs:
  cycle:
    # inert until you set the HERMES_ACTIONS_ENABLED=1 repository variable —
    # avoids double-trading when the engine runs on a VPS instead
    if: ${{ vars.HERMES_ACTIONS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: data
          key: hermes-market-${{ github.run_id }}
          restore-keys: |
            hermes-market-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_SIMULATED: ${{ vars.OKX_SIMULATED || '1' }}
        run: python -m hermes cycle --mode ${{ vars.HERMES_MODE || 'paper' }}

      - name: Persist trading state
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add -f state/registry.json state/risk.json state/trader.json \
                     state/universe.json \
                     state/journal.jsonl state/hermes.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: trading cycle $(date -u +%FT%TZ) [skip ci]"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase --autostash && sleep $((2 ** i))
            done
          fi
