<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermes — poste de pilotage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101211">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Inter;src:url(fonts/InterVariable.woff2)format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/JetBrainsMono-Regular.woff2)format('woff2');font-weight:400;font-display:swap}

/* ── Jetons ───────────────────────────────────────────────────────────
   Sombre par défaut : un poste de trading se regarde des heures durant.
   Le clair reste complet, pas un négatif automatique.                  */
:root{
  color-scheme:dark;
  --fond:#101211; --surface:#171a19; --surface-2:#1e2221; --bord:#2a2f2d;
  --encre:#f4f5f3; --encre-2:#a8aea9; --encre-3:#6f7671;
  /* Direction = polarité : paire divergente bleu↔rouge, ΔE 19,2 en
     protanopie. Le vert/rouge habituel échoue ce test ; ici la couleur
     est en plus toujours doublée du mot LONG / SHORT.                  */
  --long:#3987e5; --short:#e66767;
  --bon:#0ca30c; --attention:#fab219; --serieux:#ec835a; --critique:#d03b3b;
  --accent:#3987e5;
  --r:14px; --r-s:9px;
  --ombre:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  color-scheme:light;
  --fond:#f7f7f5; --surface:#ffffff; --surface-2:#f2f2ef; --bord:#e2e2dd;
  --encre:#0b0b0b; --encre-2:#52514e; --encre-3:#86857f;
  --long:#2a78d6; --short:#e34948; --accent:#2a78d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fond);color:var(--encre)}
body{font:400 15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom)}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 64px}

/* ── En-tête ─────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 0 18px;border-bottom:1px solid var(--bord);margin-bottom:20px}
.marque{display:flex;align-items:baseline;gap:9px}
.marque b{font-size:20px;font-weight:650;letter-spacing:-.02em}
.marque span{font-size:12px;color:var(--encre-3);text-transform:uppercase;letter-spacing:.09em}
.pastille{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  padding:4px 10px;border-radius:999px;border:1px solid var(--bord);
  background:var(--surface);color:var(--encre-2);white-space:nowrap}
.pastille i{width:7px;height:7px;border-radius:50%;background:var(--encre-3);flex:none}
.pastille.vif i{background:var(--bon);box-shadow:0 0 0 3px color-mix(in oklab,var(--bon) 25%,transparent)}
.pastille.mort i{background:var(--critique)}
.pousse{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.ghost{font:inherit;font-size:12px;color:var(--encre-2);background:var(--surface);
  border:1px solid var(--bord);border-radius:999px;padding:5px 12px;cursor:pointer}
button.ghost:hover{color:var(--encre);border-color:var(--encre-3)}

/* ── Verdict : la réponse en premier ─────────────────────────────── */
.verdict{background:var(--surface);border:1px solid var(--bord);border-radius:var(--r);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--ombre);
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.verdict .titre{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.verdict h1{font-size:19px;font-weight:640;letter-spacing:-.015em}
.verdict p{color:var(--encre-2);font-size:14px;max-width:62ch}
.jeton{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  padding:3px 9px;border-radius:6px;white-space:nowrap}
.jeton.actif{background:color-mix(in oklab,var(--bon) 18%,transparent);color:var(--bon)}
.jeton.attente{background:color-mix(in oklab,var(--attention) 18%,transparent);color:var(--attention)}
.jeton.stop{background:color-mix(in oklab,var(--critique) 20%,transparent);color:var(--critique)}
.chiffre{text-align:right}
.chiffre .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.chiffre .l{font-size:11px;color:var(--encre-3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.hausse{color:var(--bon)} .baisse{color:var(--critique)}

/* ── Grille ──────────────────────────────────────────────────────── */
.grille{display:grid;gap:16px;margin-bottom:16px;align-items:start}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.carte{background:var(--surface);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--ombre);overflow:hidden}
.carte>h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--encre-3);padding:14px 18px 0;display:flex;align-items:center;gap:8px}
.carte>h2 .aide{font-weight:400;text-transform:none;letter-spacing:0;color:var(--encre-3);
  font-size:12px;margin-left:auto}
.corps{padding:14px 18px 18px}
.vide{color:var(--encre-3);font-size:13px;padding:18px;text-align:center}

/* ── Décisions ───────────────────────────────────────────────────── */
.decision{border-top:1px solid var(--bord);padding:14px 18px}
.decision:first-of-type{border-top:0}
.dtete{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dsym{font-weight:640;font-size:15px;letter-spacing:-.01em}
.dpx{color:var(--encre-2);font-size:13px}
.sens{font-size:11px;font-weight:650;letter-spacing:.06em;padding:3px 9px;border-radius:6px;
  display:inline-flex;align-items:center;gap:5px}
.sens.long{background:color-mix(in oklab,var(--long) 20%,transparent);color:var(--long)}
.sens.short{background:color-mix(in oklab,var(--short) 20%,transparent);color:var(--short)}
.sens.plat{background:var(--surface-2);color:var(--encre-3)}
.motif{margin-left:auto;font-size:12px;color:var(--encre-3)}
.mesures{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:var(--bord);border:1px solid var(--bord);border-radius:var(--r-s);overflow:hidden}
.mesure{background:var(--surface);padding:9px 11px}
.mesure .l{font-size:10.5px;color:var(--encre-3);text-transform:uppercase;letter-spacing:.06em}
.mesure .v{font-size:15px;font-weight:560;margin-top:2px}
.mesure .v.petit{font-size:13px;font-weight:500}

/* Barre « edge contre coût » : la contrainte qui mord, visible */
.barre{margin-top:11px}
.barre .piste{height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.barre .rempli{height:100%;border-radius:99px;background:var(--accent)}
.barre .seuil{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--encre-2)}
.barre .leg{display:flex;justify-content:space-between;margin-top:6px;
  font-size:11px;color:var(--encre-3)}

/* ── Rail TP/SL ──────────────────────────────────────────────────── */
.rail{margin-top:10px}
.rail .piste{position:relative;height:38px;border-radius:var(--r-s);
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--critique) 16%,transparent) 0%,
    var(--surface-2) 50%,
    color-mix(in oklab,var(--bon) 16%,transparent) 100%)}
.rail .marq{position:absolute;top:0;bottom:0;width:2px;background:var(--encre-3)}
.rail .marq.sl{background:var(--critique)} .rail .marq.tp{background:var(--bon)}
.rail .marq.now{background:var(--encre);width:3px;border-radius:2px}
/* PRIX se place sous le rail : colle a l'objectif il chevauchait son
   etiquette, et les deux comptent. */
.rail .marq.now b{top:auto;bottom:-1px;color:var(--encre)}
.rail .marq b.g{left:0;transform:none}
.rail .marq b.d{left:auto;right:0;transform:none}
.rail .marq b{position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  font-size:9.5px;font-weight:600;letter-spacing:.05em;white-space:nowrap;
  color:var(--encre-3);background:var(--surface);padding:0 4px;border-radius:3px}
.rail .leg{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--encre-3)}

/* ── Jauges de risque ────────────────────────────────────────────── */
.jauge+.jauge{margin-top:14px}
.jauge .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.jauge .t span:first-child{color:var(--encre-2)}
.jauge .piste{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.jauge .rempli{height:100%;border-radius:99px;background:var(--bon);transition:width .3s}
.jauge.att .rempli{background:var(--attention)} .jauge.cri .rempli{background:var(--critique)}

/* ── Tableaux ────────────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--encre-3);padding:0 10px 8px;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid var(--bord);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── Graphe ──────────────────────────────────────────────────────── */
.graphe{position:relative}
.graphe svg{display:block;width:100%;height:190px;overflow:visible}
.infobulle{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface-2);border:1px solid var(--bord);border-radius:var(--r-s);
  padding:8px 11px;font-size:12px;box-shadow:var(--ombre);white-space:nowrap;z-index:5}
.infobulle .d{color:var(--encre-3);font-size:11px;margin-bottom:2px}

footer{color:var(--encre-3);font-size:12px;text-align:center;padding:28px 0 10px}
@media(max-width:1100px){.mesures{grid-template-columns:repeat(2,1fr)}
  /* cinq mesures sur deux colonnes laissent la derniere orpheline a cote
     d'une cellule vide qui se lit comme un bug : elle prend la ligne */
  .mesures>.mesure:last-child:nth-child(odd){grid-column:1/-1}}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}
  .verdict{grid-template-columns:1fr}.chiffre{text-align:left}
  .wrap{padding:12px 12px 56px}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="marque"><b>Hermes</b><span id="mode">—</span></div>
    <div class="pastille" id="lien"><i></i><span>connexion…</span></div>
    <div class="pastille" id="horloge"><i></i><span>—</span></div>
    <div class="pousse">
      <button class="ghost" id="theme">Clair</button>
    </div>
  </header>

  <section class="verdict">
    <div>
      <div class="titre"><span class="jeton attente" id="etat">…</span><h1 id="verdict-t">Chargement</h1></div>
      <p id="verdict-p">Lecture de l'état du moteur.</p>
    </div>
    <div class="chiffre">
      <div class="v num" id="equity">—</div>
      <div class="l">Équité · <span id="pnl">—</span></div>
    </div>
  </section>

  <div class="grille g2">
    <div class="carte">
      <h2>Décisions en cours <span class="aide" id="dec-aide"></span></h2>
      <div id="decisions"><div class="vide">Aucune donnée moteur.</div></div>
    </div>
    <div>
      <div class="carte" style="margin-bottom:16px">
        <h2>Budget de risque</h2>
        <div class="corps" id="risque"><div class="vide">—</div></div>
      </div>
      <div class="carte" style="margin-bottom:16px">
        <h2>Levier</h2>
        <div class="corps" id="levier"><div class="vide">—</div></div>
      </div>
      <div class="carte">
        <h2>Équité <span class="aide">marquée au marché</span></h2>
        <div class="corps graphe" id="graphe">
          <svg id="svg" viewBox="0 0 600 190" preserveAspectRatio="none" role="img"
               aria-label="Courbe d'équité du compte"></svg>
          <div class="infobulle" id="bulle"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="carte" style="margin-bottom:16px">
    <h2>Positions ouvertes <span class="aide" id="pos-aide"></span></h2>
    <div id="positions"><div class="vide">Aucune position ouverte.</div></div>
  </div>

  <div class="carte" style="margin-bottom:16px">
    <h2>Derniers trades</h2>
    <div class="defile" id="trades"><div class="vide">Aucun trade enregistré.</div></div>
  </div>

  <footer>Hermes · <span id="maj">—</span></footer>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CLE = new URLSearchParams(location.search).get("key") || "";
const api = p => fetch(p + (CLE ? (p.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(CLE) : ""),
                       {cache:"no-store"});

/* ── Formats ─────────────────────────────────────────────────────── */
const nf = (v,d=2) => (v==null||!isFinite(v)) ? "—"
  : v.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const usdt = v => nf(v,2) + " USDT";
const pct  = (v,d=2) => (v==null||!isFinite(v)) ? "—" : (v*100).toLocaleString("fr-FR",
  {minimumFractionDigits:d,maximumFractionDigits:d}) + " %";
const bps  = (v,d=1) => (v==null||!isFinite(v)) ? "—" : nf(v,d) + " bps";
const sgn  = v => (v>0?"+":"") + nf(v,2);
const heure = ts => new Date(ts*1000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const court = i => (i||"").split("-")[0];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Motifs du moteur traduits en français, avec ce qu'ils veulent dire. */
const MOTIFS = {
  "cost":   ["Prévision sous le coût", "le mouvement annoncé ne couvre pas l'aller-retour"],
  "no-ev":  ["Aucun bracket rentable", "aucune paire objectif/stop ne bat ses propres frais"],
  "veto":   ["Modèle en veto", "l'apprentissage n'a pas validé d'avantage hors échantillon"],
  "wait":   ["Modèle en attente", "pas encore assez d'observations pour se prononcer"],
  "":       ["—", ""]
};
const motif = r => MOTIFS[r] || [r, ""];

/* ── État ────────────────────────────────────────────────────────── */
let dernier = null, serie = [], echecs = 0;

/* ── Thème ───────────────────────────────────────────────────────── */
(function(){
  let t = null;
  try { t = localStorage.getItem("hermes-theme"); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  const maj = () => $("theme").textContent =
    document.documentElement.dataset.theme === "light" ? "Sombre" : "Clair";
  maj();
  $("theme").onclick = () => {
    const n = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem("hermes-theme", n); } catch(e){}
    maj(); if (dernier) rendre(dernier);
  };
})();

/* ── Verdict : la première chose qu'on lit ───────────────────────── */
function rendreVerdict(d){
  const s = d.scalp || {}, preds = s.preds || [];
  const pos = Object.entries((d.trader||{}).paper_broker?.pos || s.positions || {})
                    .filter(([,q]) => Math.abs(q) > 1e-12);
  const halte = !!(s.halted || (d.risk||{}).halted_today || (d.risk||{}).killed);
  const actifs = preds.filter(p => p.dir && p.dir !== "flat");

  let jeton, titre, texte;
  if (halte) {
    jeton = ["stop","Arrêté"];
    titre = "Trading suspendu par le risque";
    texte = (d.risk||{}).kill_reason
      || "La limite de perte journalière ou le coupe-circuit de drawdown est atteint. "
       + "Aucun ordre ne partira tant que la limite n'est pas repassée.";
  } else if (pos.length) {
    jeton = ["actif","En position"];
    titre = pos.length + (pos.length>1 ? " positions ouvertes" : " position ouverte");
    texte = "Chaque position porte un objectif et un stop calculés avant l'entrée. "
          + "Le rail ci-dessous montre où se trouve le prix entre les deux.";
  } else if (actifs.length) {
    jeton = ["actif","Signal"];
    titre = actifs.length + " signal" + (actifs.length>1?"s":"") + " prêt" + (actifs.length>1?"s":"") + " à l'exécution";
    texte = "Le bracket est rentable après frais. L'ordre part à la prochaine barre.";
  } else {
    jeton = ["attente","En attente"];
    // La vraie réponse à « pourquoi ça ne trade pas ».
    const comptes = {};
    preds.forEach(p => { const r = p.reason || ""; comptes[r] = (comptes[r]||0)+1; });
    const top = Object.entries(comptes).sort((a,b)=>b[1]-a[1])[0];
    const [nom, expl] = motif(top ? top[0] : "");
    titre = preds.length ? nom : "Moteur sans données";
    const rt = s.round_trip_bps, h = s.horizon_bars;
    const ric = preds.length ? Math.min(...preds.map(p => p.required_ic ?? Infinity)) : null;
    const maj1 = t => t ? t[0].toUpperCase() + t.slice(1) : t;
    texte = preds.length
      ? maj1(expl) + ". Sur cet horizon (" + (h||"?") + " barres) et avec un aller-retour de "
        + bps(rt) + ", la prévision doit capter au moins "
        + (isFinite(ric) ? nf(ric,3) : "—") + " de corrélation avec le mouvement à venir "
        + "pour qu'un trade soit rentable. Rester plat est la décision correcte tant que ce seuil n'est pas franchi."
      : "Le moteur n'a pas encore publié de prédiction.";
  }
  $("etat").className = "jeton " + jeton[0];
  $("etat").textContent = jeton[1];
  $("verdict-t").textContent = titre;
  $("verdict-p").textContent = texte;
}

/* ── Décisions par instrument ────────────────────────────────────── */
function rendreDecisions(d){
  const s = d.scalp || {}, preds = (s.preds || []).slice()
    .sort((a,b) => Math.abs(b.edge_bps||0) - Math.abs(a.edge_bps||0));
  $("dec-aide").textContent = preds.length
    ? "horizon " + (s.horizon_bars||"?") + " barres · aller-retour " + bps(s.round_trip_bps)
    : "";
  if (!preds.length) { $("decisions").innerHTML = '<div class="vide">Aucune donnée moteur.</div>'; return; }

  $("decisions").innerHTML = preds.map(p => {
    const dir = p.dir === "long" ? ["long","▲ LONG"] : p.dir === "short" ? ["short","▼ SHORT"] : ["plat","— PLAT"];
    const [nom] = motif(p.reason || "");
    const edge = Math.abs(p.edge_bps || 0), cout = p.cost_bps || 0;
    const part = cout > 0 ? Math.min(1, edge / (cout * 2.5)) : 0;
    const seuil = cout > 0 ? (1 / 2.5) * 100 : 50;
    return `<div class="decision">
      <div class="dtete">
        <span class="dsym">${esc(court(p.inst))}</span>
        <span class="dpx num">${nf(p.px, p.px>1000?1:4)}</span>
        <span class="sens ${dir[0]}">${dir[1]}</span>
        ${p.dir==="flat" ? `<span class="motif">${esc(nom)}</span>` : ""}
      </div>
      <div class="mesures">
        <div class="mesure"><div class="l">Mouvement prévu</div>
          <div class="v num">${bps(p.edge_bps)}</div></div>
        <div class="mesure"><div class="l">Coût aller-retour</div>
          <div class="v num">${bps(cout)}</div></div>
        <div class="mesure"><div class="l">Espérance</div>
          <div class="v num ${(p.ev_bps||0)>0?"hausse":""}">${bps(p.ev_bps)}</div></div>
        <div class="mesure"><div class="l">Objectif / Stop</div>
          <div class="v num petit">${bps(p.tp_bps,0)} / ${bps(p.sl_bps,0)}</div></div>
        <div class="mesure"><div class="l">Corrélation requise</div>
          <div class="v num petit">${nf(p.required_ic,3)}</div></div>
      </div>
      <div class="barre">
        <div class="piste">
          <div class="rempli" style="width:${(part*100).toFixed(1)}%"></div>
          <div class="seuil" style="left:${seuil.toFixed(1)}%"></div>
        </div>
        <div class="leg"><span>mouvement prévu</span>
          <span>le repère marque le coût — à gauche, le trade perd</span></div>
      </div>
    </div>`;
  }).join("");
}

/* ── Positions avec rail objectif/stop ───────────────────────────── */
function rendrePositions(d){
  const s = d.scalp || {}, br = s.brackets || {};
  const pb = (d.trader||{}).paper_broker || {};
  const pos = pb.pos || s.positions || {};
  const prix = d.tickers || {};
  const lignes = Object.entries(pos).filter(([,q]) => Math.abs(q) > 1e-12);
  $("pos-aide").textContent = lignes.length ? lignes.length + " ouverte(s)" : "";
  if (!lignes.length) { $("positions").innerHTML = '<div class="vide">Aucune position ouverte.</div>'; return; }

  $("positions").innerHTML = lignes.map(([inst, q]) => {
    const b = br[inst] || {};
    const t = prix[inst] || {};
    const px = Number(t.last) || Number(b.entry) || 0;
    const entree = Number(b.entry) || px;
    const sl = Number(b.sl), tp = Number(b.tp);
    const lng = q > 0;
    const notion = Math.abs(q) * px;
    const pnl = q * (px - entree);
    // Le rail est un axe perte -> gain, pas un axe de prix : le stop reste a
    // gauche et l'objectif a droite dans les deux sens. Un short affichait
    // sinon son stop du cote vert du degrade.
    const span = lng ? (tp - sl) : (sl - tp);
    const at = v => {
      if (!isFinite(v) || !isFinite(span) || Math.abs(span) < 1e-12) return 50;
      const f = lng ? (v - sl) / span : (sl - v) / span;
      return Math.max(0, Math.min(100, f * 100));
    };
    const m = (v, cls, lab, bord) => (isFinite(v) && v>0)
      ? `<div class="marq ${cls}" style="left:${at(v).toFixed(2)}%"><b class="${bord||""}">${lab}</b></div>` : "";
    return `<div class="decision">
      <div class="dtete">
        <span class="dsym">${esc(court(inst))}</span>
        <span class="sens ${lng?"long":"short"}">${lng?"▲ LONG":"▼ SHORT"}</span>
        <span class="dpx num">${nf(Math.abs(q),6)} · ${usdt(notion)}</span>
        <span class="motif num ${pnl>=0?"hausse":"baisse"}">${sgn(pnl)} USDT</span>
      </div>
      <div class="rail">
        <div class="piste">
          ${m(sl,"sl","STOP","g")}${m(entree,"","ENTRÉE")}${m(tp,"tp","OBJECTIF","d")}${m(px,"now","PRIX")}
        </div>
        <div class="leg">
          <span class="num">${isFinite(sl)?nf(sl,px>1000?1:4):"—"} · perte</span>
          <span>${b.sl_bps?("stop "+bps(b.sl_bps,0)+" · objectif "+bps(b.tp_bps,0)):""}</span>
          <span class="num">gain · ${isFinite(tp)?nf(tp,px>1000?1:4):"—"}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ── Risque & levier ─────────────────────────────────────────────── */
function jauge(nom, util, limite, detail){
  const p = limite > 0 ? Math.min(1, Math.max(0, util / limite)) : 0;
  const cls = p >= .85 ? "cri" : p >= .5 ? "att" : "";
  return `<div class="jauge ${cls}">
    <div class="t"><span>${esc(nom)}</span><span class="num">${detail}</span></div>
    <div class="piste"><div class="rempli" style="width:${(p*100).toFixed(1)}%"></div></div>
  </div>`;
}
function rendreRisque(d){
  const s = d.scalp || {}, r = d.risk || {}, lim = s.risk_limits || {};
  const eq = Number(d.equity_live || s.equity || 0);
  const pic = Number(r.peak_equity || eq), debut = Number(r.day_start_equity || eq);
  const dd = pic > 0 ? Math.max(0, 1 - eq/pic) : 0;
  const jour = debut > 0 ? Math.max(0, 1 - eq/debut) : 0;
  const dlim = (lim.dd_pct ?? 25) / 100, jlim = (lim.daily_pct ?? 8) / 100;
  $("risque").innerHTML =
      jauge("Perte du jour", jour, jlim, pct(jour,2) + " / " + pct(jlim,0))
    + jauge("Drawdown depuis le pic", dd, dlim, pct(dd,2) + " / " + pct(dlim,0))
    + `<div class="jauge"><div class="t"><span>Exposition autorisée</span>
        <span class="num">${pct(lim.scale ?? 1,0)}</span></div>
        <div class="piste"><div class="rempli" style="width:${((lim.scale??1)*100).toFixed(0)}%"></div></div></div>`
    + (r.killed ? `<p style="margin-top:12px;font-size:12.5px;color:var(--critique)">
        Coupe-circuit déclenché — ${esc(r.kill_reason||"")}</p>` : "");
}
function rendreLevier(d){
  const l = (d.scalp||{}).lev || {};
  const util = Number(l.used||0), cap = Number(l.gross_cap||0);
  $("levier").innerHTML =
      jauge("Notionnel / équité", util, cap, nf(util,2) + "× / " + nf(cap,0) + "×")
    + jauge("Marge engagée", Number(l.margin||0), 1, pct(l.margin||0,1) + " / 100 %")
    + `<div class="jauge"><div class="t"><span>Plafond par instrument</span>
        <span class="num">${nf(l.name_cap||0,0)}×</span></div></div>`;
}

/* ── Trades ──────────────────────────────────────────────────────── */
const RAISON = {open:"Ouverture", close:"Clôture", resize:"Ajustement"};
function rendreTrades(d){
  const t = ((d.scalp||{}).trades || []).slice().reverse().slice(0,40);
  if (!t.length) { $("trades").innerHTML = '<div class="vide">Aucun trade enregistré.</div>'; return; }
  $("trades").innerHTML = `<table class="tbl"><thead><tr>
      <th>Heure</th><th>Actif</th><th>Sens</th><th class="r">Notionnel</th>
      <th class="r">Prix</th><th class="r">Frais</th><th>Motif</th></tr></thead><tbody>` +
    t.map(x => {
      const achat = (x.qty||0) > 0;
      let r = x.reason || "";
      r = RAISON[r] || (r.startsWith("SL") ? "Stop " + r.slice(2).trim()
                     : r.startsWith("TP") ? "Objectif " + r.slice(2).trim()
                     : r.startsWith("time-stop") ? "Temps écoulé" : r);
      return `<tr>
        <td class="num">${heure(x.ts)}</td>
        <td>${esc(court(x.inst))}</td>
        <td><span class="sens ${achat?"long":"short"}">${achat?"ACHAT":"VENTE"}</span></td>
        <td class="r num">${usdt(x.notional)}</td>
        <td class="r num">${nf(x.px, (x.px>1000)?1:4)}</td>
        <td class="r num">${nf(x.fee,3)}</td>
        <td>${esc(r)}</td></tr>`;
    }).join("") + "</tbody></table>";
}

/* ── Courbe d'équité ─────────────────────────────────────────────── */
/* Une seule série : pas de légende, le titre la nomme. Repère + info-bulle
   au survol, comme l'exige toute courbe interactive.                     */
function rendreGraphe(){
  const svg = $("svg"), W = 600, H = 190, P = {t:12,r:10,b:20,l:10};
  if (serie.length < 2) { svg.innerHTML =
    `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--encre-3)"
           font-size="12" font-family="Inter">En attente de points…</text>`; return; }
  const xs = serie.map(p=>p[0]), ys = serie.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=(y1-y0)*.12 || Math.max(1,y0*.001); y0-=pad; y1+=pad;
  const X=v=>P.l+((v-x0)/((x1-x0)||1))*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-y0)/((y1-y0)||1))*(H-P.t-P.b);
  const d = serie.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const aire = d + ` L${X(x1).toFixed(1)} ${H-P.b} L${X(x0).toFixed(1)} ${H-P.b} Z`;
  const base = serie[0][1], fin = serie[serie.length-1][1];
  const teinte = fin >= base ? "var(--bon)" : "var(--critique)";
  svg.innerHTML = `
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${teinte}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${teinte}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(base).toFixed(1)}" y2="${Y(base).toFixed(1)}"
          stroke="var(--bord)" stroke-dasharray="3 4"/>
    <path d="${aire}" fill="url(#g)"/>
    <path d="${d}" fill="none" stroke="${teinte}" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <line id="crx" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--encre-3)"
          stroke-width="1" opacity="0"/>
    <circle id="crp" r="4" fill="${teinte}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  const bulle = $("bulle"), hote = $("graphe"), crx = svg.querySelector("#crx"), crp = svg.querySelector("#crp");
  const bouge = ev => {
    const b = svg.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const vx = ((cx - b.left) / b.width) * W;
    let best = 0, bd = 1e9;
    serie.forEach((p,i)=>{ const dd=Math.abs(X(p[0])-vx); if(dd<bd){bd=dd;best=i;} });
    const p = serie[best], px = X(p[0]), py = Y(p[1]);
    crx.setAttribute("x1",px); crx.setAttribute("x2",px); crx.setAttribute("opacity","1");
    crp.setAttribute("cx",px); crp.setAttribute("cy",py); crp.setAttribute("opacity","1");
    const dp = p[1]-base;
    bulle.innerHTML = `<div class="d">${heure(p[0])}</div>
      <b class="num">${usdt(p[1])}</b>
      <span class="num ${dp>=0?"hausse":"baisse"}"> ${sgn(dp)}</span>`;
    bulle.style.opacity = "1";
    const gl = (px/W)*hote.clientWidth;
    bulle.style.left = Math.min(Math.max(gl-60, 4), hote.clientWidth-140) + "px";
    bulle.style.top = Math.max(4, (py/H)*hote.clientHeight - 54) + "px";
  };
  svg.onmousemove = bouge; svg.ontouchmove = bouge;
  svg.onmouseleave = svg.ontouchend = () => {
    bulle.style.opacity="0"; crx.setAttribute("opacity","0"); crp.setAttribute("opacity","0");
  };
}

/* ── Boucle ──────────────────────────────────────────────────────── */
function rendre(d){
  dernier = d;
  $("mode").textContent = (d.mode === "live") ? "réel" : "papier";
  const eq = Number(d.equity_live || (d.scalp||{}).equity || 0);
  const dep = Number(((d.trader||{}).paper_broker||{}).start_cash || 10000);
  const el = $("pnl");
  if (!(eq > 0)) {
    // Sans état de courtier, l'équité n'est pas nulle : elle est inconnue.
    // Afficher « -100 % » ferait passer une absence de donnée pour une ruine.
    $("equity").textContent = "—";
    el.textContent = "en attente du moteur"; el.className = "";
  } else {
    $("equity").textContent = usdt(eq);
    const dp = eq - dep;
    el.textContent = sgn(dp) + " USDT (" + pct(dep?dp/dep:0,2) + ")";
    el.className = dp >= 0 ? "hausse" : "baisse";
  }
  rendreVerdict(d); rendreDecisions(d); rendrePositions(d);
  rendreRisque(d); rendreLevier(d); rendreTrades(d);
  const ts = Number(d.now || Date.now()/1000);
  $("maj").textContent = "mis à jour " + heure(ts);
  const age = (d.scalp||{}).ts ? (ts - d.scalp.ts) : null;
  const h = $("horloge");
  h.className = "pastille" + (age==null ? "" : age < 120 ? " vif" : " mort");
  h.querySelector("span").textContent = age==null ? "moteur inconnu"
    : age < 120 ? "moteur actif" : "moteur muet depuis " + Math.round(age/60) + " min";
}

async function battre(){
  try{
    const r = await api("/api/status");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    echecs = 0;
    const l = $("lien"); l.className = "pastille vif";
    l.querySelector("span").textContent = "connecté";
    const eq = Number(d.equity_live || (d.scalp||{}).equity || 0);
    const ts = Number(d.now || Date.now()/1000);
    // Amorçage : le journal du moteur porte déjà l'historique d'équité, donc
    // la courbe n'a pas à rester vide le temps que le navigateur en accumule.
    if (!serie.length && Array.isArray(d.journal)) {
      serie = d.journal
        .filter(j => j && j.ts > 0 && Number(j.equity) > 0)
        .map(j => [Number(j.ts), Number(j.equity)])
        .sort((a,b) => a[0]-b[0])
        .slice(-900);
    }
    if (eq > 0) {
      const last = serie[serie.length-1];
      if (!last || ts - last[0] >= 4) serie.push([ts, eq]);
      if (serie.length > 900) serie = serie.slice(-900);
    }
    rendre(d); rendreGraphe();
  }catch(e){
    echecs++;
    const l = $("lien");
    l.className = "pastille" + (echecs > 2 ? " mort" : "");
    l.querySelector("span").textContent = echecs > 2 ? "hors ligne" : "reconnexion…";
  }
}
battre(); setInterval(battre, 5000);
